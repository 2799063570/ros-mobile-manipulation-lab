TebLocalPlannerROS:
  odom_topic: odom

  # Differential-drive limits, matching the previous navigation setup.
  max_vel_x: 0.50
  max_vel_x_backwards: 0.10
  max_vel_theta: 1.2
  acc_lim_x: 1.0
  acc_lim_theta: 2.0
  min_turning_radius: 0.0
  cmd_angle_instead_rotvel: false
  allow_init_with_backwards_motion: false
  weight_kinematics_forward_drive: 100.0

  # costmap_common.yaml uses robot_radius 0.24 plus 0.01 padding.
  footprint_model:
    type: circular
    radius: 0.25

  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.15
  free_goal_vel: false

  include_costmap_obstacles: true
  min_obstacle_dist: 0.10
  inflation_dist: 0.18
  costmap_obstacles_behind_robot_dist: 1.0

  teb_autosize: true
  dt_ref: 0.3
  dt_hysteresis: 0.1
  max_global_plan_lookahead_dist: 2.0
  global_plan_viapoint_sep: 0.5
  enable_homotopy_class_planning: false
