# The simulated chassis radius is 0.34 m. Keep 0.02 m total clearance
# without making the workstation docking pose effectively unreachable.
robot_radius: 0.35
footprint_padding: 0.01
transform_tolerance: 0.5

obstacle_layer:
  enabled: true
  obstacle_range: 6.0
  raytrace_range: 8.0
  max_obstacle_height: 2.0
  observation_sources: merged_laser
  merged_laser:
    sensor_frame: base_footprint
    data_type: LaserScan
    topic: /scan
    # The merged scan is nominally 15 Hz, but Gazebo can occasionally miss
    # several timer cycles while MoveIt and navigation are running together.
    expected_update_rate: 0.30
    observation_persistence: 0.0
    inf_is_valid: true
    marking: true
    clearing: true

inflation_layer:
  enabled: true
  inflation_radius: 0.50
  cost_scaling_factor: 3.5
