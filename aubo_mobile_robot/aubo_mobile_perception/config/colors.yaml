colors:
  red:
    ranges:
      - {lower: [0, 110, 70], upper: [12, 255, 255]}
      - {lower: [168, 110, 70], upper: [179, 255, 255]}
    draw_bgr: [0, 0, 255]
  green:
    ranges:
      - {lower: [38, 70, 55], upper: [88, 255, 255]}
    draw_bgr: [0, 255, 0]
  blue:
    ranges:
      - {lower: [95, 90, 55], upper: [132, 255, 255]}
    draw_bgr: [255, 0, 0]

min_contour_area: 180.0
max_contour_area: 8000.0
# 过滤画面边缘被截断的细长分类色块，只保留接近方形的抓取目标。
max_aspect_ratio: 1.6
morphology_kernel: 5

# 移动平台当前只有 RGB 图像；共用检测器将使用平面投影定位。
use_depth: false

# 所有高度均在 target_frame（base_link）下表达。
target_frame: base_link
table_z: 0.14
object_height: 0.04
# 图像看到的是方块顶面；X/Y 射线应与顶面而不是桌面求交。
projection_plane_z: 0.18
# DetectedObject.pose 发布方块几何中心高度。
object_center_z: 0.16
workspace_min_x: 0.40
workspace_max_x: 0.82
workspace_min_y: -0.22
workspace_max_y: 0.22

# 模型坐标修正后不再使用经验补偿；只在实测仍有固定误差时微调。
position_offset_x: 0.0
position_offset_y: 0.0
