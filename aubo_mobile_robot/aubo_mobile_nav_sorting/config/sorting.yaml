# 导航分拣机械臂基础配置；单桌默认在 x=2.15 m 停靠。
# 抓取位姿使用 base_link；桌体和放置点分别使用 table_frame、place_frame。
# 四桌任务运行时按当前工位覆盖桌体和放置配置。
planning_group: aubo_i5
# 实例队列由后台线程持续更新；有效目标连续抓取，缺少可靠目标才回观察位。
continuous_sorting: true
queue_match_distance: 0.04
queue_stable_distance: 0.015
queue_duplicate_distance: 0.008
queue_max_age: 10.0
queue_confirmation_gap: 1.0
queue_retention: 30.0
queue_done_hold: 2.0
queue_frame_max_age: 1.0
queue_empty_confirmation: 2.0
queue_empty_min_frames: 5
# 抓取区域为 table_frame 下的桌面 XY 范围，排除各放置点周围的区域。
queue_place_exclusion_radius: 0.08
queue_gripper_exclusion_radius: 0.10
queue_height_tolerance: 0.04
end_effector_link: tcp_link
target_frame: base_link
detections_topic: /sorting/detections
gripper_action: /gripper_controller/follow_joint_trajectory

table_z: 0.14
# Gazebo 世界坐标与 odom 重合；桌体固定在 odom 下，
# 避免 AMCL 对 map→odom 的修正使规划场景中的桌子偏移。
table_frame: odom
table_center: [3.00, 0.0, 0.25]
table_size: [0.80, 1.20, 0.40]
# 桌体各水平侧面增加碰撞余量；高度保持原值，允许夹爪接近桌面物体。
table_collision_margin: 0.03
object_height: 0.04
# 抓取点相对物块中心抬高，保持与固定平台场景一致并避免指尖碰桌。
grasp_height_offset: 0.01
scene_update_timeout: 10.0

grasp_rpy: [3.141592653589793, 0.0, 0.0]
observation_pose: [0.63, 0.0, 0.62]
observation_named_target: observe
work_ready_named_target: work_ready
auto_move_to_observation: false
auto_start: false
pregrasp_height: 0.25
# 移动停靠场景中的远端方块比固定平台更远。
# 过高的抬升点可能超出夹爪朝下的可达范围，采用距桌面 0.26 m 的抬升高度。
lift_height: 0.26
# 抬升规划失败或路径不完整时，每次降低 2 cm，最低距桌面 18 cm，最多尝试 5 次。
# 执行失败或收到停止请求时不重试。
lift_min_height: 0.18
lift_height_step: 0.02
lift_max_attempts: 5
# 放置前接近和放置后退离使用独立的较低高度。
# 此值相对桌面：base_link 下为 0.14 + 0.24 = 0.38 m。
preplace_height: 0.24
place_clearance: 0.02
cartesian_step: 0.01
minimum_cartesian_fraction: 0.90

gripper_open: 0.0
# 对 40 mm 方块，关节为 0.20 rad 时抓取带开口约 42 mm。
# 0.28 rad 时仅约 37 mm，会明显穿入已吸附方块。
gripper_closed: 0.20
gripper_motion_time: 0.8
gripper_contact_tolerance: 0.30

use_grasp_attachment: true
grasp_attach_topic: /sorting/grasp/attach
grasp_detach_topic: /sorting/grasp/detach
grasp_status_topic: /sorting/grasp/status
grasp_attachment_timeout: 3.0

sort_colors: [red, green, blue]
# Gazebo 放置区固定在世界坐标及与之重合的 odom 坐标系下。
place_frame: odom
place_targets:
  red: [2.66, -0.24]
  green: [2.80, -0.24]
  blue: [2.66, 0.24]

detection_timeout: 15.0
detection_samples: 8
detection_settle_time: 1.0
verify_observation_detections: true
observation_verification_timeout: 4.0
# 每种颜色分别累计多帧验证，不要求所有颜色同时在一帧通过轮廓过滤。
observation_verification_min_frames: 3
grasp_offset_x: 0.0
grasp_offset_y: 0.0

# 以下 map 缓存及 fallback 开关仅控制 continuous_sorting=false 的旧流程。
# 新流程使用 target_frame 下的实例队列，每次开始/切换工作区重新采样；
# target_cache_min_observations 仍用于实例确认，fallback_delay 用于队列补充等待。
target_cache_frame: map
target_cache_min_observations: 5
target_cache_max_age: 30.0
target_cache_outlier_distance: 0.12
target_cache_fallback_enabled: false
target_cache_fallback_delay: 2.0

moveit_server_timeout: 30.0
gripper_server_timeout: 30.0
planning_time: 12.0
velocity_scaling: 0.6
acceleration_scaling: 0.15
# 导航前调用 /sorting/home，将机械臂收至紧凑的 transport 姿态。
finish_named_target: transport

# 障碍物通过参数化碰撞体加入 MoveIt 规划场景。
# RGB-D 用于物体定位，当前不将 OctoMap 就绪作为运动规划的前置条件。
require_octomap: false
point_cloud_topic: /workspace_camera/points_for_moveit
planning_scene_topic: /move_group/monitored_planning_scene
clear_octomap_service: /clear_octomap
octomap_wait_timeout: 30.0
base_lock_topic: /sorting/base_locked
failure_topic: /sorting/failure
workspace_config_param: /sorting/workspace_config
workspace_update_topic: /sorting/workspace_update
