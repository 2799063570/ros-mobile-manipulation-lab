# nav_sorting.world 在 x=2.15 m 停靠；以下均为停靠后的 base_link 坐标。
planning_group: aubo_i5
end_effector_link: tcp_link
target_frame: base_link
detections_topic: /sorting/detections
gripper_action: /gripper_controller/follow_joint_trajectory

table_z: 0.14
# Static Gazebo table pose in map/world coordinates. It is transformed into
# MoveIt's planning frame both at startup and again after navigation.
table_frame: map
table_center: [3.00, 0.0, 0.25]
table_size: [0.80, 1.20, 0.40]
# Extra clearance on each horizontal side; vertical size remains exact so the
# gripper can still approach objects resting on the tabletop.
table_collision_margin: 0.03
object_height: 0.04
# Put the TCP at the centre of the 40 mm block.  The previous +10 mm offset
# left the fingers too high for a reliable task-specific grasp.
grasp_height_offset: 0.0
scene_update_timeout: 10.0

grasp_rpy: [3.141592653589793, 0.0, 0.0]
observation_pose: [0.63, 0.0, 0.62]
observation_named_target: observe
work_ready_named_target: work_ready
auto_move_to_observation: false
auto_start: false
pregrasp_height: 0.25
lift_height: 0.30
place_clearance: 0.02
cartesian_step: 0.01
minimum_cartesian_fraction: 0.90

gripper_open: 0.0
gripper_closed: 0.28
gripper_motion_time: 2.5
gripper_contact_tolerance: 0.30

use_grasp_attachment: true
grasp_attach_topic: /sorting/grasp/attach
grasp_detach_topic: /sorting/grasp/detach
grasp_status_topic: /sorting/grasp/status
grasp_attachment_timeout: 3.0

sort_colors: [red, green, blue]
# Static pad centres in map coordinates. They are transformed into base_link at
# execution time, so fine-docking y/yaw adjustments do not offset placement.
place_frame: map
place_targets:
  red: [2.66, -0.24]
  green: [2.80, -0.24]
  blue: [2.66, 0.24]

detection_timeout: 15.0
detection_samples: 8
detection_settle_time: 1.0
verify_observation_detections: true
observation_verification_timeout: 4.0
grasp_offset_x: 0.0
grasp_offset_y: 0.0
moveit_server_timeout: 30.0
gripper_server_timeout: 30.0
planning_time: 12.0
velocity_scaling: 0.15
acceleration_scaling: 0.15
# Navigation mission calls /sorting/home before move_base starts. Keep the arm
# in its compact A-shaped configuration while travelling.
finish_named_target: transport

# Rebuild the chassis-frame occupancy map after every navigation leg and lock
# the velocity output while MoveIt owns the manipulator workspace.
require_octomap: true
point_cloud_topic: /workspace_camera/points_for_moveit
planning_scene_topic: /move_group/monitored_planning_scene
clear_octomap_service: /clear_octomap
octomap_wait_timeout: 30.0
base_lock_topic: /sorting/base_locked
failure_topic: /sorting/failure
workspace_config_param: /sorting/workspace_config
workspace_update_topic: /sorting/workspace_update
