# 分拣工位在 map 坐标系中的停靠位姿。机器人朝向 +X，工作台中心在其前方 0.8 m。
navigation_frame: map
sorting_goal: [2.15, 0.0, 0.0]

# 近场协同停靠：先停在桌前安全位置，再从候选位姿中选择同时满足底盘间距、
# 相机中心和检测工作区的方案。每次精停后由 MoveIt 与实际检测共同验证；失败时
# 自动收臂并尝试下一个候选。
near_field_enabled: true
pre_dock_goal: [1.85, 0.0, 0.0]
near_field_candidate_x: [2.16, 2.10, 2.06]
near_field_candidate_y: [0.0, -0.08, 0.08]
near_field_candidate_yaw: [0.0, -0.08, 0.08]
near_field_max_candidates: 6

# map 坐标下的桌子包围盒、三个方块中心，以及底盘中心到桌边的最小距离。
near_field_table: [3.00, 0.0, 0.80, 1.20]
near_field_workpieces:
  - [2.78, -0.12]
  - [2.86, 0.0]
  - [2.78, 0.12]
near_field_base_clearance: 0.40

# 检测程序在 base_link 下允许的范围，以及 observe 相机中心射线落点。
near_field_detector_workspace: [0.40, 0.82, -0.22, 0.22]
near_field_camera_target: [0.62, 0.0]

# 导航与任务容错。工位/预停靠位、安全间距、超时和重试可在 RViz 面板或
# rqt_reconfigure 中在线修改；为保证整段任务参数一致，运行期间的修改会被拒绝。
navigation_action: /move_base
navigation_timeout: 180.0
navigation_retries: 1
server_timeout: 45.0
sorting_initialization_timeout: 60.0
sorting_operation_timeout: 300.0
startup_delay: 3.0

# 导航前收起机械臂；精停后复用 aubo_mobile_sorting 的观察与分拣服务。
home_before_navigation: true
sorting_state_topic: /sorting/state
sorting_home_service: /sorting/home
sorting_prepare_service: /sorting/prepare_work
sorting_observe_service: /sorting/move_to_observation
sorting_start_service: /sorting/start
sorting_stop_service: /sorting/stop

# true：系统就绪后自动执行一次；false：等待 /nav_sorting/start。
auto_start: false
