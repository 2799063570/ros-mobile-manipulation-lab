# 仅用于 four_tables_gazebo.launch 的导航参数。
# move_base 负责预停点，任务节点随后通过独立低速控制器直线精靠。
# 预停点需要足够精确，避免留下直线控制器无法修正的侧向误差。

# 收到新目标或当前路径失效时规划，取消每秒一次的周期性全局重规划。
planner_frequency: 0.0
controller_frequency: 12.0
controller_patience: 8.0

# 提前检测无进展状态；狭窄预停区域不使用旋转恢复（启动文件已禁用）。
oscillation_timeout: 7.0
oscillation_distance: 0.10

DWAPlannerROS:
  # 降低桌椅附近速度，允许小范围倒车修正越过目标的误差，减少转向振荡。
  max_vel_x: 0.22
  min_vel_x: -0.06
  max_vel_trans: 0.22
  min_vel_trans: 0.01
  max_vel_theta: 0.35
  min_vel_theta: 0.03
  acc_lim_x: 0.35
  acc_lim_theta: 0.70

  # 缩短轨迹预测时间并增加速度采样密度，改善桌角和绕行墙附近的控制。
  sim_time: 1.30
  vx_samples: 20
  vtheta_samples: 40
  path_distance_bias: 28.0
  goal_distance_bias: 24.0
  occdist_scale: 0.08
  forward_point_distance: 0.15
  stop_time_buffer: 0.30

  # 预停点位置容差为 1 cm；剩余航向误差由任务节点闭环对正。
  xy_goal_tolerance: 0.01
  yaw_goal_tolerance: 0.08
  latch_xy_goal_tolerance: true
  trans_stopped_vel: 0.02
  theta_stopped_vel: 0.03

# 四桌场景默认使用 TEB，启动时也可选择 DWA。
# 两个规划器参数分属独立命名空间，便于同场景对照调试。
TebLocalPlannerROS:
  odom_topic: odom
  map_frame: map

  # 轨迹时间离散化，以及跟随绕墙全局路径的约束。
  teb_autosize: true
  dt_ref: 0.25
  dt_hysteresis: 0.05
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: true
  max_global_plan_lookahead_dist: 2.50
  global_plan_prune_distance: 0.60
  global_plan_viapoint_sep: 0.30
  via_points_ordered: true
  feasibility_check_no_poses: 8
  exact_arc_length: false
  publish_feedback: false

  # 差速底盘运动限制：允许小幅倒车修正，正常路径通过权重优先选择前进。
  max_vel_x: 0.22
  max_vel_x_backwards: 0.06
  max_vel_y: 0.0
  max_vel_theta: 0.35
  acc_lim_x: 0.35
  acc_lim_y: 0.0
  acc_lim_theta: 0.70
  min_turning_radius: 0.0
  cmd_angle_instead_rotvel: false

  # 预停点位置容差为 1 cm；到达后由任务节点执行航向对正和最终直线精靠。
  xy_goal_tolerance: 0.01
  yaw_goal_tolerance: 0.08
  free_goal_vel: false
  complete_global_plan: true

  # 代价地图机器人半径为 0.35 m；显式指定圆形优化轮廓，
  # 避免 TEB 使用点模型而规划出过于贴近桌边的轨迹。
  footprint_model:
    type: circular
    radius: 0.35
  min_obstacle_dist: 0.06
  inflation_dist: 0.16
  dynamic_obstacle_inflation_dist: 0.16
  include_costmap_obstacles: true
  include_dynamic_obstacles: false
  costmap_obstacles_behind_robot_dist: 1.00
  obstacle_poses_affected: 20
  legacy_obstacle_association: false
  obstacle_association_force_inclusion_factor: 1.5
  obstacle_association_cutoff_factor: 5.0

  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.04
  weight_max_vel_x: 2.0
  weight_max_vel_theta: 2.0
  weight_acc_lim_x: 1.0
  weight_acc_lim_theta: 1.0
  weight_kinematics_nh: 1000.0
  weight_kinematics_forward_drive: 8.0
  weight_kinematics_turning_radius: 1.0
  weight_optimaltime: 1.0
  weight_shortest_path: 0.2
  weight_obstacle: 60.0
  weight_inflation: 0.2
  weight_viapoint: 10.0
  weight_adapt_factor: 2.0

  # 绕墙方向已由全局规划器决定；保留单条 TEB 候选，避免桌椅附近左右切换。
  enable_homotopy_class_planning: false
  enable_multithreading: false
  max_number_classes: 1
  shrink_horizon_backup: true
  oscillation_recovery: true
