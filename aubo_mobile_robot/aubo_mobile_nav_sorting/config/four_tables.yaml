# 第一阶段四桌任务模板。坐标均在 map 下，部署前必须用现场地图重新标定。
navigation_frame: map

# 每张桌子完成后，机械臂收回 transport，再由 move_base 导航到下一张桌子。
# objects 是“已知物体”接口：当前分拣仍可使用 /sorting/detections；后续感知模块
# 可更新本参数并调用 /sorting/configure_workspace，或订阅当前工位话题进行融合。
workstations:
  - id: table_1
    navigation_goal: [2.00, 0.20, 1.5708]
    table_frame: map
    table_center: [2.00, 1.00, 0.25]
    table_size: [0.80, 0.80, 0.40]
    # 抓取高度使用 sorting 核心 target_frame(base_link) 下的标定值。
    table_z: 0.14
    place_frame: map
    place_targets:
      red: [1.82, 0.88]
      green: [2.00, 0.88]
      blue: [2.18, 0.88]
    objects:
      - {id: table_1_red, color: red, position: [1.88, 1.08, 0.49]}
      - {id: table_1_green, color: green, position: [2.00, 1.08, 0.49]}
      - {id: table_1_blue, color: blue, position: [2.12, 1.08, 0.49]}

  - id: table_2
    navigation_goal: [3.20, 1.00, 0.0]
    table_frame: map
    table_center: [4.00, 1.00, 0.25]
    table_size: [0.80, 0.80, 0.40]
    table_z: 0.14
    place_frame: map
    place_targets:
      red: [3.88, 0.82]
      green: [3.88, 1.00]
      blue: [3.88, 1.18]
    objects:
      - {id: table_2_red, color: red, position: [4.08, 0.88, 0.49]}
      - {id: table_2_green, color: green, position: [4.08, 1.00, 0.49]}
      - {id: table_2_blue, color: blue, position: [4.08, 1.12, 0.49]}

  - id: table_3
    navigation_goal: [4.00, -0.20, -1.5708]
    table_frame: map
    table_center: [4.00, -1.00, 0.25]
    table_size: [0.80, 0.80, 0.40]
    table_z: 0.14
    place_frame: map
    place_targets:
      red: [4.18, -0.88]
      green: [4.00, -0.88]
      blue: [3.82, -0.88]
    objects:
      - {id: table_3_red, color: red, position: [4.12, -1.08, 0.49]}
      - {id: table_3_green, color: green, position: [4.00, -1.08, 0.49]}
      - {id: table_3_blue, color: blue, position: [3.88, -1.08, 0.49]}

  - id: table_4
    navigation_goal: [2.80, -1.00, 3.14159]
    table_frame: map
    table_center: [2.00, -1.00, 0.25]
    table_size: [0.80, 0.80, 0.40]
    table_z: 0.14
    place_frame: map
    place_targets:
      red: [2.12, -1.18]
      green: [2.12, -1.00]
      blue: [2.12, -0.82]
    objects:
      - {id: table_4_red, color: red, position: [1.92, -1.12, 0.49]}
      - {id: table_4_green, color: green, position: [1.92, -1.00, 0.49]}
      - {id: table_4_blue, color: blue, position: [1.92, -0.88, 0.49]}

navigation_action: /move_base
navigation_timeout: 180.0
navigation_retries: 1
server_timeout: 45.0
sorting_initialization_timeout: 60.0
sorting_operation_timeout: 300.0
home_before_navigation: true

# 机械臂明确发布 PLANNING_FAILED 后，才暂停导航并使用以下 cmd_vel 直移。
# 每一步只能沿 base_link 的 x 或 y 单轴移动；列表是连续增量，不是绝对坐标。
base_recovery_enabled: true
base_recovery_cmd_vel_topic: /cmd_vel_raw
base_recovery_speed: 0.04
base_recovery_rate: 20.0
base_recovery_settle_time: 0.8
base_recovery_steps:
  - [0.00, 0.06]
  - [0.00, -0.12]
  - [0.00, 0.06]
  - [0.05, 0.00]
  - [-0.10, 0.00]

sorting_state_topic: /sorting/state
sorting_failure_topic: /sorting/failure
sorting_home_service: /sorting/home
sorting_prepare_service: /sorting/prepare_work
sorting_observe_service: /sorting/move_to_observation
sorting_start_service: /sorting/start
sorting_stop_service: /sorting/stop
sorting_configure_service: /sorting/configure_workspace
sorting_workspace_param: /sorting/workspace_config

auto_start: false
