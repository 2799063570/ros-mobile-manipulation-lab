#!/usr/bin/env python3

PACKAGE = "aubo_mobile_follower"

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t, int_t


generator = ParameterGenerator()

hsv = generator.add_group("HSV threshold")
hsv.add("h_min", int_t, 0, "HSV lower hue", 0, 0, 180)
hsv.add("s_min", int_t, 0, "HSV lower saturation", 110, 0, 255)
hsv.add("v_min", int_t, 0, "HSV lower value", 80, 0, 255)
hsv.add("h_max", int_t, 0, "HSV upper hue", 10, 0, 180)
hsv.add("s_max", int_t, 0, "HSV upper saturation", 255, 0, 255)
hsv.add("v_max", int_t, 0, "HSV upper value", 255, 0, 255)

detection = generator.add_group("Detection")
detection.add("min_area_fraction", double_t, 0, "Minimum detected image area", 0.002, 0.0, 0.25)
detection.add("target_area_fraction", double_t, 0, "Desired target image area", 0.075, 0.001, 0.50)
detection.add("x_deadband", double_t, 0, "Horizontal error deadband", 0.06, 0.0, 0.50)
detection.add("area_deadband", double_t, 0, "Area error deadband", 0.012, 0.0, 0.25)

control = generator.add_group("Control")
control.add("linear_kp", double_t, 0, "Linear proportional gain", 1.2, 0.0, 5.0)
control.add("angular_kp", double_t, 0, "Angular proportional gain", 1.1, 0.0, 5.0)
control.add("max_linear_speed", double_t, 0, "Maximum forward speed", 0.24, 0.0, 0.60)
control.add("max_reverse_speed", double_t, 0, "Maximum reverse speed", 0.08, 0.0, 0.30)
control.add("max_angular_speed", double_t, 0, "Maximum yaw speed", 0.55, 0.0, 1.50)

exit(generator.generate(PACKAGE, "aubo_mobile_follower", "ColorFollower"))
