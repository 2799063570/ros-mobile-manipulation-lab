controller_list:
  - name: fake_aubo_i5_controller
    type: $(arg fake_execution_type)
    joints:
      - shoulder_joint
      - upperArm_joint
      - foreArm_joint
      - wrist1_joint
      - wrist2_joint
      - wrist3_joint
  - name: fake_gripper_controller
    type: $(arg fake_execution_type)
    joints:
      - joint1
      - joint2
initial:  # Define initial robot poses.
  - group: aubo_i5
    pose: zero