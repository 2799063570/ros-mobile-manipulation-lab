#!/usr/bin/env python
# -*- coding: utf-8 -*-

PACKAGE = "aubo_sorting_core"
from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()
gen.add("planning_pipeline", str_t, 0, "MoveIt planning pipeline (empty: startup default)", "")
gen.add("planner_id", str_t, 0, "Planner in the selected pipeline (empty: pipeline default)", "")
gen.add("detection_timeout", double_t, 0, "Wait for a detected object (s)", 15.0, 1.0, 120.0)
gen.add("detection_samples", int_t, 0, "Frames used for target averaging", 8, 1, 30)
gen.add("grasp_offset_x", double_t, 0, "Grasp X correction in target frame (m)", 0.0, -0.05, 0.05)
gen.add("grasp_offset_y", double_t, 0, "Grasp Y correction in target frame (m)", 0.0, -0.05, 0.05)
gen.add("stacked_grasp_offset_z", double_t, 0, "Extra TCP Z correction only for elevated objects; positive raises TCP (m)", 0.0, -0.05, 0.05)
gen.add("stacked_support_min_height", double_t, 0, "Minimum estimated object bottom height above table for stacked Z correction (m)", 0.02, 0.005, 0.30)
gen.add("minimum_gripper_height", double_t, 0, "Minimum grasp/release TCP height above the table (m)", 0.06, 0.0, 0.5)
gen.add("velocity_scaling", double_t, 0, "MoveIt velocity scaling", 0.15, 0.01, 1.0)
gen.add("acceleration_scaling", double_t, 0, "MoveIt acceleration scaling", 0.15, 0.01, 1.0)
gen.add("target_cache_min_observations", int_t, 0, "Stable frames before queue dispatch", 5, 2, 30)
gen.add("queue_max_age", double_t, 0, "Maximum observation age for a new queue reservation (s)", 10.0, 0.2, 30.0)
gen.add("queue_merge_distance", double_t, 0, "Maximum world center distance for overlapping duplicate detections (m)", 0.02, 0.001, 0.04)
gen.add("queue_merge_overlap", double_t, 0, "Intersection area divided by the smaller footprint area", 0.5, 0.05, 1.0)

exit(gen.generate(PACKAGE, "color_sorting_task", "SortingTask"))
