servo_mode: eye_in_hand
camera_link: camera_color_optical_frame
control_link: tcp_link

# Desired object pose in the gripper TCP frame.  Keeping X/Y at zero aligns the
# object with the gripper centreline instead of the laterally-offset camera
# optical axis.  The camera is about 35 mm behind the TCP, so a 0.115 m TCP
# standoff still produces approximately 0.15 m of camera depth.
desired_target_position: [0.0, 0.0, 0.115]
# Independent controller-side guard. This remains below the desired distance
# and matches the perception frontend's minimum valid depth.
minimum_safe_target_distance: 0.10
desired_target_rpy: [0.0, 0.0, 0.0]
target_offset: [0.0, 0.0, 0.0]
use_orientation_control: false

# Eye-in-hand measurements arrive more slowly than the 100 Hz control loop.
# Conservative Cartesian gain/speed plus stronger DLS damping suppress delayed
# corrections and joint amplification near singular configurations.
linear_gain: 0.45
max_linear_velocity: 0.04
position_deadband: 0.006
alignment_hold_time: 0.35
alignment_release_multiplier: 2.0
dls_lambda: 0.08

# Move to the observation posture with the task planner before enabling servo.
# Target loss holds position; no autonomous arm search is performed here.
