# Shared PBVS, integration and target-loss settings for Gazebo and the robot.
# Units: position=m, joint angle=rad, velocity=rad/s, acceleration=rad/s^2.
base_link: base_link
camera_link: hand_camera_optical_frame
target_topic: /visual_servo/target_pose
joint_states_topic: /joint_states
control_rate: 100.0
output_rate: 200.0

# Pose of the object that we want to see, expressed in the camera optical frame
# (+Z forward, +X right, +Y down). Orientation control is off by default.
desired_target_position: [0.0, 0.0, 0.35]
desired_target_rpy: [0.0, 0.0, 0.0]
use_orientation_control: false
linear_gain: 0.8
angular_gain: 0.5
max_camera_linear_velocity: 0.08
max_camera_angular_velocity: 0.20
position_deadband: 0.004
dls_lambda: 0.04

joint_names: [shoulder_joint, upperArm_joint, foreArm_joint,
              wrist1_joint, wrist2_joint, wrist3_joint]
joint_lower_limits: [-3.04, -1.0471976, -3.04, -3.04, -3.04, -3.04]
joint_upper_limits: [ 3.04,  1.0471976,  3.04,  3.04,  3.04,  3.04]
joint_velocity_limits: [0.50, 0.50, 0.50, 0.70, 0.70, 0.70]
joint_acceleration_limits: [0.80, 0.80, 0.80, 1.20, 1.20, 1.20]
joint_limit_margin: 0.08

# Target-loss state machine. "coast_then_open" first keeps the last velocity
# with exponential decay, then moves to a camera-friendly open posture.
target_timeout: 0.20
loss_strategy: coast_then_open       # stop | coast | coast_then_open
coast_duration: 0.35
coast_decay_time: 0.18
search_timeout: 8.0
open_posture: [0.0, 0.20, 1.20, 0.0, 1.20, 0.0]
open_posture_gain: 0.7
search_velocity_limit: 0.20

# Queue is bounded to limit command latency. A state transition flushes stale
# points so reacquisition and emergency deceleration take effect promptly.
command_queue_capacity: 80
feedback_blend: 0.02

# Direct SDK backend only.
robot_ip: 192.168.1.2
server_port: 8899
username: aubo
password: "123456"
collision_class: 6
require_real_robot: true
# 60 values = about 10 six-axis points = 50 ms at the 5 ms SDK period.  A
# visual loop should not use the much deeper buffer used for offline paths.
sdk_mac_buffer_target: 60
