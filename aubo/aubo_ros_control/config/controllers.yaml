joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

aubo_i5_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - shoulder_joint
    - upperArm_joint
    - foreArm_joint
    - wrist1_joint
    - wrist2_joint
    - wrist3_joint
  constraints:
    goal_time: 2.0
    stopped_velocity_tolerance: 0.05
    # 20 个 5 ms 预装点及控制柜队列会带来约 100--200 ms 的固定
    # 跟随延迟。执行期容差覆盖该传输延迟；最终目标容差仍为 0.05 rad。
    shoulder_joint: {trajectory: 0.15, goal: 0.05}
    upperArm_joint:  {trajectory: 0.15, goal: 0.05}
    foreArm_joint:   {trajectory: 0.15, goal: 0.05}
    wrist1_joint:    {trajectory: 0.15, goal: 0.05}
    wrist2_joint:    {trajectory: 0.15, goal: 0.05}
    wrist3_joint:    {trajectory: 0.15, goal: 0.05}
  state_publish_rate: 50
  action_monitor_rate: 20
  stop_trajectory_duration: 1.0
