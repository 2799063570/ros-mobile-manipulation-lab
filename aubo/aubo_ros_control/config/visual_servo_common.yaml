# Common visual-servo control, safety and target-loss settings.
# Mount-specific geometry is loaded from visual_servo_eye_*.yaml.
base_link: base_link
target_topic: /visual_servo/target_pose
state_topic: /visual_servo/state
joint_states_topic: /joint_states
start_enabled: false
# 统一调度：视觉闭环 20 ms，轨迹插值/伺服路点 5 ms。
feedback_rate: 50.0
control_rate: 50.0
output_rate: 200.0
# 独立PBVS：最新速度目标覆盖，SDK按需取5ms平滑点；hybrid保留原回放路径。
on_demand_output: true
feedback_timeout: 0.15
control_target_timeout: 0.04
max_following_error: 0.12

linear_gain: 0.8
angular_gain: 0.5
max_linear_velocity: 0.08
max_angular_velocity: 0.20
position_deadband: 0.004
orientation_deadband: 0.02
alignment_hold_time: 0.35
alignment_release_multiplier: 2.0
dls_lambda: 0.04

joint_names: [shoulder_joint, upperArm_joint, foreArm_joint,
              wrist1_joint, wrist2_joint, wrist3_joint]
joint_lower_limits: [-3.04, -1.0471976, -3.04, -3.04, -3.04, -3.04]
joint_upper_limits: [ 3.04,  1.0471976,  3.04,  3.04,  3.04,  3.04]
joint_velocity_limits: [0.50, 0.50, 0.50, 0.70, 0.70, 0.70]
joint_acceleration_limits: [0.80, 0.80, 0.80, 1.20, 1.20, 1.20]
joint_jerk_limits: [8.0, 8.0, 8.0, 12.0, 12.0, 12.0]
joint_limit_margin: 0.08

target_timeout: 0.20
loss_strategy: coast
coast_duration: 0.35
coast_decay_time: 0.18
recovery_delay: 1.0
reacquire_hold_time: 0.30
search_timeout: 8.0
# Backwards-compatible fallback. Camera modes should provide viewpoints whose
# optical axes have been checked against their actual target workspaces.
open_posture: [0.0, 0.20, 1.20, 0.0, 1.20, 0.0]
open_posture_gain: 0.7
search_velocity_limit: 0.20
command_queue_capacity: 80
# 旧队列/hybrid路径使用；按需输出不反馈混合，也不叠加该速度滤波。
# 系数由原100 Hz换算到50 Hz。
feedback_blend: 0.0396
tracking_velocity_filter_alpha: 0.3276

# Direct SDK backend only.
robot_ip: 192.168.1.2
server_port: 8899
username: aubo
password: "123456"
collision_class: 6
require_real_robot: true
# 未显式设置目标时，按需路径采用300标量/50点，旧队列路径仍默认60标量。
# 目标和水位均为名义观测；已经入柜的点不能被新目标撤回。
sdk_mac_buffer_limit: 360
sdk_diagnosis_timeout: 0.15
