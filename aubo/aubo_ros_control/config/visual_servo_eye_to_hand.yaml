servo_mode: eye_to_hand
camera_link: workspace_camera_color_optical_frame
control_link: tcp_link

# The fixed-camera target is transformed to base_link. The TCP tracks this
# offset point. The lateral component keeps the arm out of the camera-target
# sight line; calibrate its sign and magnitude for the actual workcell.
# Keep the TCP 10 cm above the detected target. This is a pre-grasp clearance,
# not a contact command; lower it only after validating the table/target TF.
target_offset: [0.0, -0.08, 0.10]
desired_target_position: [0.0, 0.0, 0.0]
# Disabled here: fixed-camera depth is not TCP-to-obstacle clearance.
minimum_safe_target_distance: 0.0
desired_target_rpy: [3.141592653589793, 0.0, 0.0]
use_orientation_control: true

# Target loss always decelerates to HOLD.
