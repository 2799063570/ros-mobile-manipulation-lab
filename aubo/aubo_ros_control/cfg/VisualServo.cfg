#!/usr/bin/env python3
# -*- coding: utf-8 -*-

PACKAGE = "aubo_ros_control"

from dynamic_reconfigure.parameter_generator_catkin import *


gen = ParameterGenerator()

# PBVS 控制器中可安全在线修改的增益、限幅和数值稳定参数。
control = gen.add_group("PBVS_Control")
control.add("linear_gain", double_t, 1 << 0, "位置误差比例增益", 0.8, 0.0, 5.0)
control.add("angular_gain", double_t, 1 << 0, "姿态误差比例增益", 0.5, 0.0, 5.0)
control.add("max_linear_velocity", double_t, 1 << 0,
            "笛卡尔最大线速度（m/s）", 0.08, 0.0, 0.5)
control.add("max_angular_velocity", double_t, 1 << 0,
            "笛卡尔最大角速度（rad/s）", 0.2, 0.0, 2.0)
control.add("position_deadband", double_t, 1 << 0,
            "位置误差死区（m）", 0.004, 0.0, 0.1)
control.add("orientation_deadband", double_t, 1 << 0,
            "姿态误差死区（rad）", 0.02, 0.0, 0.5)
control.add("alignment_hold_time", double_t, 1 << 0,
            "到位标志置位前的稳定时间（s）", 0.35, 0.0, 5.0)
control.add("alignment_release_multiplier", double_t, 1 << 0,
            "到位标志清除阈值倍数（不影响连续跟踪）", 2.0, 1.0, 5.0)
control.add("dls_lambda", double_t, 1 << 0,
            "阻尼最小二乘系数", 0.04, 0.001, 1.0)
control.add("feedback_blend", double_t, 1 << 0,
            "积分位置向反馈位置回拉的比例", 0.02, 0.0, 1.0)

# 期望位姿和安全距离。分量形式便于 rqt_reconfigure 使用滑块调节。
target = gen.add_group("Target_and_Safety")
target.add("desired_target_x", double_t, 1 << 1,
           "眼在手上 TCP 系的期望目标 X（m）", 0.0, -2.0, 2.0)
target.add("desired_target_y", double_t, 1 << 1,
           "眼在手上 TCP 系的期望目标 Y（m）", 0.0, -2.0, 2.0)
target.add("desired_target_z", double_t, 1 << 1,
           "眼在手上 TCP 系的期望目标 Z（m）", 0.115, 0.0, 2.0)
target.add("target_offset_x", double_t, 1 << 1,
           "眼在手外模式的 TCP 目标偏移 X（m）", 0.0, -2.0, 2.0)
target.add("target_offset_y", double_t, 1 << 1,
           "眼在手外模式的 TCP 目标偏移 Y（m）", 0.0, -2.0, 2.0)
target.add("target_offset_z", double_t, 1 << 1,
           "眼在手外模式的 TCP 目标偏移 Z（m）", 0.0, -2.0, 2.0)
target.add("desired_roll", double_t, 1 << 1,
           "期望横滚角（rad）", 0.0, -3.141593, 3.141593)
target.add("desired_pitch", double_t, 1 << 1,
           "期望俯仰角（rad）", 0.0, -3.141593, 3.141593)
target.add("desired_yaw", double_t, 1 << 1,
           "期望偏航角（rad）", 0.0, -3.141593, 3.141593)
target.add("use_orientation_control", bool_t, 1 << 1,
           "是否启用姿态闭环", False)
target.add("minimum_safe_target_distance", double_t, 1 << 1,
           "眼在手上目标最小安全深度（m），0 表示关闭", 0.0, 0.0, 2.0)

# Target loss always requests a controlled stop. Search is a task-layer action.
loss = gen.add_group("Target_Loss")
loss.add("target_timeout", double_t, 1 << 2,
         "目标消息超时时间（s）", 0.2, 0.01, 10.0)

exit(gen.generate(PACKAGE, "aubo_ros_control", "VisualServo"))
