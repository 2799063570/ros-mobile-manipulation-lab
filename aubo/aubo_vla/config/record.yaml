image_topic: /workspace_camera/color/image_raw
camera_info_topic: /workspace_camera/color/camera_info
# 使用控制器原始反馈；/joint_states 转发节点可能重复发布缓存位置。
joint_states_topic: /aubo_i5/joint_states
base_frame: base_link
tcp_frame: tcp_link
sample_rate: 2.0
sync_slop: 0.05
max_age: 1.0
pause_timeout: 2.0
joint_names: [shoulder_joint, upperArm_joint, foreArm_joint, wrist1_joint, wrist2_joint, wrist3_joint]
# 该关节必须存在于反馈消息中；必要时接入单独转接或合并后的真实反馈。
gripper_joint: joint1
gripper_open: 0.0
gripper_closed: 0.28
instruction: pick up the red block and place it in the red area
scene_id: fixed_eye_to_hand
