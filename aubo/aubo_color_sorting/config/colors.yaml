colors:
  red:
    ranges:
      - {lower: [0, 110, 70], upper: [12, 255, 255]}
      - {lower: [168, 110, 70], upper: [179, 255, 255]}
    draw_bgr: [0, 0, 255]
  green:
    ranges:
      - {lower: [38, 70, 55], upper: [88, 255, 255]}
    draw_bgr: [0, 255, 0]
  blue:
    ranges:
      - {lower: [95, 90, 55], upper: [132, 255, 255]}
    draw_bgr: [255, 0, 0]

min_contour_area: 180.0
max_contour_area: 8000.0
# 过滤画面边缘被截断的细长分类色块，只保留接近方形的抓取目标。
max_aspect_ratio: 1.6
morphology_kernel: 5

# 使用对齐深度只提取方块顶面；这样画面两侧可见的侧面不会拉偏轮廓中心。
use_depth: true
max_depth_age: 0.25
top_surface_tolerance: 0.008
min_top_surface_points: 30
# 用顶面点云 5%~95% 稳健边界的中点，降低边缘深度噪声影响。
top_surface_percentile: 5.0

# 所有高度均在 target_frame（base_link）下表达。
target_frame: base_link
table_z: 0.10
object_height: 0.04
# 图像看到的是方块顶面；X/Y 射线应与顶面而不是桌面求交。
projection_plane_z: 0.14
# DetectedObject.pose 发布方块几何中心高度。
object_center_z: 0.12
workspace_min_x: 0.38
workspace_max_x: 0.82
workspace_min_y: -0.20
workspace_max_y: 0.20

# 模型坐标修正后不再使用经验补偿；只在实测仍有固定误差时微调。
position_offset_x: 0.0
position_offset_y: 0.0
