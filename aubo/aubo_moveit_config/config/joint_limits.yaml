# Allow the PointCloudOctomapUpdater to wait for the next simulated robot TF.
# The depth camera and joint-state controllers are independent Gazebo update
# loops, so an exact cloud timestamp can briefly be ahead of the latest TF.
shape_transform_cache_lookup_wait_time: 0.25

# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed
# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
joint_limits:
  joint1:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint2:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 2.0
  foreArm_joint:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.8
  shoulder_joint:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.8
  upperArm_joint:
    # Global task safety limit: -60 deg ... +60 deg. Keep this synchronized
    # with aubo_description/urdf/arm.xacro and visual-servo integration limits.
    has_position_limits: true
    min_position: -1.0471976
    max_position: 1.0471976
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 0.8
  wrist1_joint:
    has_velocity_limits: true
    max_velocity: 0.7
    has_acceleration_limits: true
    max_acceleration: 1.2
  wrist2_joint:
    has_velocity_limits: true
    max_velocity: 0.7
    has_acceleration_limits: true
    max_acceleration: 1.2
  wrist3_joint:
    has_velocity_limits: true
    max_velocity: 0.7
    has_acceleration_limits: true
    max_acceleration: 1.2
