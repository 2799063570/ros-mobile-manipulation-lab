# ros_control configuration used by the MoveIt Gazebo launch path.
moveit_sim_hw_interface:
  joint_model_group: aubo_i5
  joint_model_group_pose: zero

generic_hw_control_loop:
  loop_hz: 300
  cycle_time_error_threshold: 0.01

hardware_interface:
  joints:
    - shoulder_joint
    - upperArm_joint
    - foreArm_joint
    - wrist1_joint
    - wrist2_joint
    - wrist3_joint
    - joint1
    - joint2
  sim_control_mode: 1

joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

aubo_i5_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - shoulder_joint
    - upperArm_joint
    - foreArm_joint
    - wrist1_joint
    - wrist2_joint
    - wrist3_joint
  constraints:
    goal_time: 2.0
    stopped_velocity_tolerance: 0.05
    shoulder_joint: {trajectory: 0.10, goal: 0.05}
    upperArm_joint:  {trajectory: 0.10, goal: 0.05}
    foreArm_joint:   {trajectory: 0.10, goal: 0.05}
    wrist1_joint:    {trajectory: 0.10, goal: 0.05}
    wrist2_joint:    {trajectory: 0.10, goal: 0.05}
    wrist3_joint:    {trajectory: 0.10, goal: 0.05}
  gains:
    shoulder_joint: {p: 100, d: 1, i: 1, i_clamp: 1}
    upperArm_joint: {p: 100, d: 1, i: 1, i_clamp: 1}
    foreArm_joint: {p: 100, d: 1, i: 1, i_clamp: 1}
    wrist1_joint: {p: 100, d: 1, i: 1, i_clamp: 1}
    wrist2_joint: {p: 100, d: 1, i: 1, i_clamp: 1}
    wrist3_joint: {p: 100, d: 1, i: 1, i_clamp: 1}

gripper_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - joint1
    - joint2
  constraints:
    goal_time: 1.0
    stopped_velocity_tolerance: 0.02
    joint1: {goal: 0.02}
    joint2: {goal: 0.02}
  gains:
    joint1: {p: 40, d: 1, i: 0.2, i_clamp: 0.5}
    joint2: {p: 40, d: 1, i: 0.2, i_clamp: 0.5}
