# Fixed camera, original table. Depth measures the visible surface, including stacks.
target_frame: base_link
table_z: 0.00285
object_height: 0.065  # 平放物体自身厚度上限/先验，不包含下层支撑；准确中心需实测此值。
# 可按类别设置厚度上限（m）；不同实例厚度不同则仍存在估计误差。
class_heights: {}
object_height_source: bounded_depth
# 自身厚度=min(表面Z-table_z, 类别厚度上限)，中心Z=表面Z-自身厚度/2。
# 较矮的桌面物体沿用实测厚度；叠放目标超过厚度上限后不再从桌面折半。
minimum_object_height: 0.005  # Reject table/noise; independent of the 6 cm TCP descent floor.
maximum_object_height: 0.30  # 表面离桌面的总高度上限，包含叠放支撑。
height_tolerance: 0.02
minimum_probability: 0.60
minimum_depth: 0.10
maximum_depth: 2.50
depth_scale_16u: 0.001
maximum_depth_age: 0.08
depth_cache_size: 90
depth_save_directory: ""
roi_scale: 0.45
class_aliases: {}
workspace: {min_x: -0.4142, max_x: 0.3258, min_y: -1.1357, max_y: -0.2057}
